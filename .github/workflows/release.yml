name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify workspace
        run: cargo build --workspace --all-features

      # Order matters: leaf crates first so path -> registry deps resolve.
      - name: Publish hokusai-core
        run: cargo publish -p hokusai-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hokusai-brush
        run: cargo publish -p hokusai-brush --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hokusai-tile-mem
        run: cargo publish -p hokusai-tile-mem --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hokusai-wasm
        run: cargo publish -p hokusai-wasm --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hokusai
        run: cargo publish -p hokusai --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
