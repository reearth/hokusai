[workspace]
resolver = "2"
members = [
    "crates/hokusai-core",
    "crates/hokusai-brush",
    "crates/hokusai-tile-mem",
    "crates/hokusai-compat",
    "hokusai",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reearth/hokusai"
version = "0.0.1"

[workspace.dependencies]
hokusai-core = { version = "0.0.1", path = "crates/hokusai-core" }
hokusai-brush = { version = "0.0.1", path = "crates/hokusai-brush" }
hokusai-tile-mem = { version = "0.0.1", path = "crates/hokusai-tile-mem" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
